<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="robots" content="noindex">
  <title>Page introuvable — ReplyIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f8fafc;--text:#0f172a;--muted:#475569;--accent:#0369a1}
    body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5rem}
    .tricolor-bar{position:fixed;top:0;left:0;right:0;height:4px;display:flex}
    .tricolor-bar span{flex:1}.t-b{background:#002395}.t-w{background:#fff}.t-r{background:#ed2939}
    .code{font-size:clamp(3.5rem,12vw,6rem);font-weight:800;letter-spacing:-.04em;color:var(--accent);line-height:1}
    h1{font-size:clamp(1.3rem,4vw,1.8rem);font-weight:800;letter-spacing:-.02em;margin:.5rem 0 .75rem}
    p{color:var(--muted);max-width:26rem;margin-bottom:1.75rem}
    .btn{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;font-size:.95rem;padding:.7rem 1.4rem;border-radius:9999px;background:var(--accent);color:#fff;text-decoration:none;transition:.2s}
    .btn:hover{background:#075985}
    .logo{position:fixed;top:1.5rem;left:1.5rem;font-weight:700;font-size:1.25rem;letter-spacing:-.03em;color:var(--text);text-decoration:none}
    .logo span{color:var(--accent)}
  </style>
</head>
<body>
  <div class="tricolor-bar" aria-hidden="true"><span class="t-b"></span><span class="t-w"></span><span class="t-r"></span></div>
  <a href="/" class="logo">Reply<span>It</span></a>
  <div class="code">404</div>
  <h1>Cette page n'existe pas</h1>
  <p>Le lien est peut-être cassé ou la page a été déplacée. Pas de panique, on vous ramène à bon port.</p>
  <a href="/" class="btn">← Retour à l'accueil</a>
</body>
</html>
